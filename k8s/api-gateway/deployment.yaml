apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: order-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/dilsh4n/api-gateway:sha-d70f2a3

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET

          imagePullPolicy: Always
