apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: order-platform
  labels:
    app: auth-service
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: auth-service
  
  template:
    metadata:
      labels:
        app: auth-service

    spec:
      imagePullSecrets:
        - name: ghcr-secret
        
      containers:
        - name: auth-service
          image: ghcr.io/dilsh4n/auth-service:sha-5aadf4b
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            - name: SPRING_DATASOURCE_USERNAME
              value: platform
          
            - name: SPRING_DATASOURCE_PASSWORD
              value: platform

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET