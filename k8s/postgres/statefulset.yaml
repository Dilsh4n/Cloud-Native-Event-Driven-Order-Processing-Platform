apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: order-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_USER
          value: platform
        - name: POSTGRES_PASSWORD
          value: platform

        volumeMounts: 
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d

      volumes:
      - name: postgres-init
        configMap:
          name: postgres-init
        

  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
