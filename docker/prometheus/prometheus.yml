global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'auth-service:8081'
          - 'order-service:8082'
          - 'inventory-service:8083'
          - 'api-gateway:8080'
          - 'payment-service:8084'