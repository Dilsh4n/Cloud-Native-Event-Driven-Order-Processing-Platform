name: CI

on:
# validate all services when a PR targets main
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
# allow manual building one selected service at a time
  workflow_dispatch:
    inputs:
      service:
        description: "Select the service to build"
        required: true
        type: choice
        options:
          - api-gateway
          - auth-service
          - order-service
          - inventory-service
          - payment-service

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dilsh4n

jobs:
  # ============================================================
  # 1. PR VALIDATION
  # ============================================================
  pr-validation:
    name: Validate ${{ matrix.service }}
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - order-service
          - inventory-service
          - payment-service

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: ${{ matrix.service }}/pom.xml

# Maven build + test
    - name: Build and test
      working-directory: ${{ matrix.service }}
      env:
        JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_DB_USERNAME }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      run: mvn -B clean verify
# buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
# docker validation
    - name: Validate Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.service }}
        push: false
        tags: |
          ${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
        cache-from: type=gha,scope=${{ matrix.service }}


  # ============================================================
  # 2. BUILD AND PUSH AFTER PR MERGE
  # ============================================================
  release:
    name: Build and push ${{ matrix.service }}
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - order-service
          - inventory-service
          - payment-service

    steps:
# checkout the exact commit that was merged into main
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
# setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
# Maven build + test
      - name: Build and test
        working-directory: ${{ matrix.service }}
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: mvn -B clean verify
# Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
# Generate image metadata (tags, labels)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
# Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
# Build and push image
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull previous build cache from GHCR
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:buildcache

          # Store updated build cache in GHCR
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:buildcache,mode=max


# ============================================================
# 3. MANUAL DEV BUILD
# ============================================================
  manual-dev-build:
    name: Manual dev build - ${{ inputs.service }}

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout dev branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ inputs.service }}/pom.xml

      - name: Build and test
        working-directory: ${{ inputs.service }}
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: mvn -B clean verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.service }}
          tags: |
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull previous cache from GHCR
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ inputs.service }}:buildcache

          # Update cache in GHCR
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ inputs.service }}:buildcache,mode=max
