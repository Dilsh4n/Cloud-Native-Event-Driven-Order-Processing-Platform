server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: ${datasource-url:jdbc:postgresql://192.168.204.130:5432/inventory_db}
    username: ${datasource-un:platform}
    password: ${datasource-pw:platform}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: 192.168.204.130:9092
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

management:
  defaults:
    metrics:
      export:
        enabled: false

  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health, prometheus

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0 #trace every request, dial down to 0.1 for 10% of requests, 0.01 for 1% of requests, etc.

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.204.130:4318/v1/traces
