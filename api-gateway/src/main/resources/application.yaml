server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: inventory-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/products/**
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/payments/**
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/orders/**
jwt:
  secret: ${jwt-secret}

security:
  public-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login

management:
  defaults:
    metrics:
      export:
        enabled: false

  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health, prometheus

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0 #trace every request, dial down to 0.1 for 10% of requests, 0.01 for 1% of requests, etc.

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.204.130:4318/v1/traces